# {{ $scmEnabled := and (env "GITHUB_REPOSITORY_OWNER") (env "GITHUB_REPOSITORY_NAME") }}
name: "java/corretto"
version: 0.121.0

# {{ if $scmEnabled }}
actions:
  pull_request:
    scmid: github
    title: 'chore(deps): Bump java/corretto version to {{ source "latest" }}-amzn'
    kind: github/pullrequest
    spec:
      labels:
        - dependencies

scms:
  github:
    disabled: false
    kind: github
    spec:
      branch: main
      owner: '{{ requiredEnv "GITHUB_REPOSITORY_OWNER" }}'
      repository: '{{ requiredEnv "GITHUB_REPOSITORY_NAME" }}'
      user: '{{ requiredEnv "UPDATECLI_GITHUB_USER" }}'
      email: '{{ requiredEnv "UPDATECLI_GITHUB_EMAIL" }}'
      username: '{{ requiredEnv "UPDATECLI_GITHUB_USER" }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "deps"
        title: 'Bump java/corretto version to {{ source "latest" }}-amzn'
        hidecredit: true
# {{ end }}

sources:
  latest:
    name: Github release for java/corretto
    kind: githubrelease
    spec:
      age:
        minimum: 2d
      owner: corretto
      repository: corretto-25
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      # comes through as 25.0.5.1.2 (major.minor.patch.build.rev); semver can't rank 5 parts
      # (regex/semver on the first 3 made 25.0.5.x all equal) so take the latest release.
      versionfilter:
        kind: latest

conditions:
  check_sdkman:
    name: JDK {{ source "latest" }} available in SDKMAN
    kind: shell
    dependson:
      - source#latest
    disablesourceinput: true
    spec:
      shell: bash
      command: >-
        v='{{ source "latest"}}-amzn';
        curl -fsSL "https://api.sdkman.io/2/candidates/validate/java/${v//+/%2B}/linuxx64"
        | grep -qx valid
        || { echo "$v not yet available in SDKMAN" >&2; exit 1; }

targets:
  update_yaml:
    kind: yaml
    sourceid: latest
    name: 'Bump java/corretto version to {{ source "latest" }}-amzn'
    # {{ if $scmEnabled }}
    scmid: github
    # {{ end }}
    spec:
      files:
        - ./config/sdk.yml
      key: $.sdkman.java
      value: '{{ source "latest" }}-amzn'
