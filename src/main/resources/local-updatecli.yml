name: "{{ .repo }}"
version: 0.121.0

sources:
  latest:
    name: Github release for {{ .repo }}
    kind: githubrelease
    spec:
      age:
        minimum: 2d
      owner: '{{ (split "/" .repo)._0 }}'
      repository: '{{ (split "/" .repo)._1 }}'
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      versionfilter:
        kind: "{{ .kind }}"
        pattern: "{{ .pattern }}"
        # {{ if .regex }}
        regex: "{{ .regex }}"
        # {{ end }}
    # {{ if .trim_prefix }}
    transformers:
      - trimprefix: "{{ .trim_prefix }}"
    # {{ end }}

targets:
  update_yaml:
    kind: yaml
    sourceid: latest
    name: 'Update {{ .repo }} version to {{ source "latest" }}'
    spec:
      files:
        - "{{ .config_file }}"
      key: "{{ .yamlpath }}"
